<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" role="img" aria-labelledby="title desc">
  <title id="title">一张照片，五种纸上风格。</title>
  <desc id="desc">Photo Collage Skill 在 Codex 中把授权照片做成撕纸拼贴或旅行印刷明信片。米色纸面、蓝色撕边和暖棕标记呼应项目的实际输出。</desc>
  <rect width="1200" height="176" fill="#F5F0E5"/>
  <path d="M1090 0h110v176h-100l4-16-9-25 17-20-12-19 15-25-14-17 11-23-18-15z" fill="#285E9B"/>
  <path d="M1076 0h14l18 14-11 23 14 17-15 25 12 19-17 20 9 25-4 16h-14l4-16-9-25 17-20-12-19 15-25-14-17 11-23-18-15z" fill="#D5C5A3"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="56" y="35" font-size="18" font-weight="600" letter-spacing="2" fill="#735F4E">PHOTO → PAPER</text>
    <text x="52" y="104" font-size="58" font-weight="700" fill="#223B3D">一张照片，五种纸上风格。</text>
    <text x="56" y="153" font-size="27" fill="#4F5D58">撕纸拼贴 · 旅行印刷明信片 · 在 Codex 中用一句话调用</text>
  </g>
</svg>
